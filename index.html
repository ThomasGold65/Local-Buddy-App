<title>LocalBuddy · Inloggen</title>

<style>
:root{--navy:#13205e;--green:#1d6b4e;--green-2:#2a8a63;--mint:#dff3e8;--muted:#6672a8;--line:#e3e6ee;--red:#c8323f;--page:#f4f5ef;--card:#fff}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--navy);font-family:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px));position:relative;overflow:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;background:var(--mint);z-index:0}
body::before{width:520px;height:520px;right:-160px;top:-180px}
body::after{width:380px;height:380px;left:-140px;bottom:-160px}
.card{position:relative;z-index:1;width:100%;max-width:380px;background:var(--card);border-radius:26px;padding:30px 24px 24px;box-shadow:0 30px 60px -28px rgba(19,32,94,.35);display:flex;flex-direction:column;gap:14px}
.brand{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:6px}
.brand b{font-size:28px;font-weight:800;letter-spacing:-.03em}
.brand b span{color:var(--green-2)}
.brand small{color:var(--green);font-weight:700}
.lead{margin:0 0 4px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.field{border:1.5px solid var(--line);border-radius:14px;padding:9px 14px;transition:border-color .15s}
.field:focus-within{border-color:var(--green-2)}
.field label{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.field input{width:100%;border:0;outline:none;font:inherit;font-size:16px;font-weight:700;color:var(--navy);background:transparent;padding:2px 0}
button{font:inherit;border:0;cursor:pointer;width:100%;padding:15px;border-radius:15px;background:var(--green);color:#fff;font-weight:700;font-size:15px;margin-top:4px}
button:disabled{opacity:.6;cursor:default}
button:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.err{color:var(--red);font-size:13px;font-weight:600;text-align:center;min-height:18px;margin:0}
.foot{text-align:center;font-size:12px;color:var(--muted);margin:4px 0 0}
</style>
</head>

<form class="card" id="f" autocomplete="on">

  </div>
  <p class="lead">Deze demo is besloten. Log in met de gegevens die je van ons hebt gekregen.</p>
  <div class="field"><label for="u">Gebruikersnaam</label><input id="u" name="username" autocomplete="username" required autocapitalize="none" spellcheck="false"></div>

  <p class="err" id="err" role="alert"></p>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pass){
  const raw=b64(PAYLOAD);
  const salt=raw.slice(8,16), ct=raw.slice(16);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},base,384));
  const key=await crypto.subtle.importKey('raw',bits.slice(0,32),'AES-CBC',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-CBC',iv:bits.slice(32,48)},key,ct);
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close()}
const f=document.getElementById('f'),err=document.getElementById('err'),btn=document.getElementById('b');
f.addEventListener('submit',async e=>{
  e.preventDefault();err.textContent='';btn.disabled=true;btn.textContent='Bezig met inloggen…';
  const pass=document.getElementById('u').value.trim()+'\n'+document.getElementById('p').value;
  try{const html=await unlock(pass);try{sessionStorage.setItem('lb-pass',pass)}catch(_){}show(html)}
  catch(_){err.textContent='Gebruikersnaam of wachtwoord klopt niet.';btn.disabled=false;btn.textContent='Inloggen'}
});
(async()=>{let p=null;try{p=sessionStorage.getItem('lb-pass')}catch(_){}
  if(p){try{show(await unlock(p))}catch(_){try{sessionStorage.removeItem('lb-pass')}catch(_){}}}})();
</script>
